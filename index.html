<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAUNCH X</title>
<style>
body{background:linear-gradient(-45deg,#00a86b,#000,#00a86b,#000);background-size:400% 400%;animation:bg 15s ease infinite;text-align:center;font-family:Arial;color:#fff;padding:20px}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
h1{color:#00ff88}
.box{background:#111c;padding:20px;border-radius:15px;width:90%;max-width:400px;margin:20px auto;border:2px solid #00ff88}
input{width:90%;padding:12px;margin:8px;border-radius:8px;border:0;background:#222;color:#fff}
.btn{background:#00ff88;color:#000;border:0;padding:12px;width:90%;border-radius:10px;font-weight:bold;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}
.card{background:#222;padding:30px 10px;border-radius:15px;border:2px solid #00ff88;box-shadow:0 5px 15px #00ff8844;cursor:pointer;transition:0.3s}
.card:active{transform:scale(0.95)}
.card b{font-size:18px;color:#00ff88}
</style>
</head>
<body>

<h1>LAUNCH<span style="color:#fff">X</span></h1>

<!-- SIGNUP -->
<div class="box" id="s">
<h2>Create Account</h2>
<input id="n" placeholder="Enter Name">
<input id="e" placeholder="Enter Email">
<input id="p" placeholder="Enter Phone">
<input id="pass" type="password" placeholder="Set Password">
<button class="btn" onclick="go()">Get Started</button>
</div>

<!-- VERIFY 30s -->
<div class="box" id="v" style="display:none">
<h2>Verifying...</h2>
<h1 id="t">30</h1>
</div>

<!-- DASHBOARD -->
<div class="box" id="d" style="display:none">
<h2>Welcome <span id="u"></span></h2>
<p>Balance: <b style="color:#00ff88" id="bal">0.00 PKR</b></p>
<div class="grid">
<div class="card" onclick="alert('Complete Tasks')"><b>📋<br>COMPLETE<br>TASK</b></div>
<div class="card" onclick="vid()"><b>▶️<br>WATCH &<br>EARN</b></div>
<div class="card" onclick="alert('Add Earn')"><b>💰<br>ADD<br>EARN</b></div>
<div class="card" onclick="open('https://wa.me/')"><b>👥<br>INVITE<br>MEMBER</b></div>
</div>
</div>

<script>
let user=JSON.parse(localStorage.lx||'{}');
if(user.n){show()}else{s.style.display='block'}

function go(){
if(!n.value||!e.value||!p.value||!pass.value){alert('All fields required');return}
user={n:n.value,e:e.value,p:p.value,pass:pass.value,bal:0};
localStorage.lx=JSON.stringify(user);
s.style.display='none';v.style.display='block';
let i=30;let x=setInterval(()=>{t.innerText=i--;if(i<0){clearInterval(x);show()}},1000)
