<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{text-align:center;background:#fff}div{width:280px;margin:20px auto;padding:15px;background:#eee;border:2px solid green;border-radius:10px}
input,button{width:90%;padding:10px;margin:5px}button{background:green;color:#fff;border:0}</style></head><body>

<h2 style="color:green">LAUNCHX</h2>
<div id="a"><input id="n" placeholder="Name"><input id="e" placeholder="Email"><input id="p" placeholder="Phone">
<input id="pw" type="password" placeholder="Password"><button onclick="g()">Start</button></div>

<div id="b" style="display:none">Wait <span id="t">30</span>s</div>

<div id="c" style="display:none"><b id="u"></b><br>Bal:<b id="bal">0</b>PKR<br>
<button onclick="alert('Task')">Task</button><button onclick="v()">Video</button>
<button onclick="alert('Earn')">Earn</button><button onclick="open('https://wa.me/')">Invite</button></div>

<script>let x=JSON.parse(localStorage.x||'{}');if(x.n)d();function g(){x={n:n.value,e:e.value,p:p.value,pw:pw.value,bal:0};localStorage.x=JSON.stringify(x);a.style.display='none';b.style.display='block';let i=30;let y=setInterval(()=>{t.innerText=i--;if(i<0){clearInterval(y);d()}},1000)}
function d(){b.style.display='none';a.style.display='none';c.style.display='block';u.innerText=x.n;bal.innerText=x.bal}
function v(){open('https://youtube.com');setTimeout(()=>{x.bal+=5;localStorage.x=JSON.stringify(x);d()},30000)}</script></body></html>
