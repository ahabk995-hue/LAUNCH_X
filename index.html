<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X EARNING - Welcome</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body,html{height:100%;overflow:hidden}
.bg{position:fixed;width:100%;height:100%;
background:linear-gradient(-45deg,#ee7752,#e73c7e,#23a6d5,#23d5ab);
background-size:400% 400%;animation:gradient 15s ease infinite;z-index:-1}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.container{display:flex;justify-content:center;align-items:center;height:100%;backdrop-filter:blur(8px)}
.box{background:rgba(255,255,255,0.1);padding:30px;border-radius:20px;
box-shadow:0 8px 32px 0 rgba(31,38,135,0.37);text-align:center;width:350px;color:#fff;
border:1px solid rgba(255,255,255,0.18)}
.box h1 { margin-bottom: 10px; font-size: 28px; }
.btn{width:100%;padding:12px;margin:8px 0;border:none;border-radius:10px;cursor:pointer;
background:#23a6d5;color:#fff;font-weight:bold;font-size:16px;transition:0.3s}
.btn:hover{background:#1c8ab3;transform:scale(1.03)}
.whatsapp{background:#25D366}.whatsapp:hover{background:#1ebe5a}
</style>
</head>
<body>
<div class="bg"></div>
<div class="container">
  <div class="box">
    <h1>Welcome to X EARNING ♾️</h1>
    <p>Earn money by completing simple tasks</p>
    
    <button class="btn" onclick="window.location='register.html'">1. Create Account</button>
    <button class="btn" onclick="window.location='login.html'">2. Login</button>
    <a href="https://wa.me/923316035482" target="_blank">
      <button class="btn whatsapp">3. WhatsApp Support: 03316035482</button>
    </a>
    <button class="btn" onclick="window.location='admin.html'">4. Admin Panel</button>
  </div>
</div>
</body>
</html>
