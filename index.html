<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch X</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #00C853; color: white; text-align: center; padding: 20px; }
    h1 { margin-bottom: 20px; font-size: 28px; }
    .box {
        background: #1B1B1B;
        padding: 25px;
        border-radius: 15px;
        max-width: 400px;
        margin: 20px auto;
    }
    .btn {
        background: #00E676;
        color: #000;
        border: none;
        padding: 15px;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
        font-size: 16px;
    }
    .btn2 {
        background: #1B1B1B;
        color: white;
        border: 2px solid #00E676;
        padding: 20px 10px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        width: 48%;
    }
    input {
        width:100%;
        padding:12px;
        border:none;
        border-radius:8px;
        margin-bottom:15px;
        background:#333;
        color:white;
    }
    .user-card { background:#333; padding:15px; border-radius:10px; margin:10px 0; text-align:left; }
    .activate-btn { background:#00E676; color:#000; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; }
</style>
</head>
<body>

<!-- 1. MAIN SCREEN -->
<div id="mainScreen" class="box">
    <h1>Launch X</h1>
    <a href="https://wa.me/923316315482" target="_blank"><button class="btn">📞 WhatsApp Support: 0331-6315482</button></a>
    <button class="btn" onclick="showSignup()">Create New Account</button>
    <button class="btn" onclick="showLogin()">Login</button>
    <button class="btn" onclick="showAdminLogin()" style="background:#FFD600">Admin Panel</button>
</div>

<!-- 2. SIGNUP SCREEN -->
<div id="signupScreen" class="box" style="display:none">
    <h2>Create Account</h2>
    <input id="name" type="text" placeholder="Enter Name">
    <input id="email" type="email" placeholder="Enter Email">
    <input id="signupPass" type="password" placeholder="Set Password">
    <input id="number" type="number" placeholder="Enter Phone Number">
    <button class="btn" onclick="submitSignup()">Submit</button>
    <p onclick="showMain()" style="margin-top:10px;cursor:pointer">Back</p>
</div>

<!-- 3. PAYMENT SCREEN -->
<div id="paymentScreen" class="box" style="display:none">
    <h2>Account Activation Fee</h2>
    <p>Send <b>300 PKR</b> to:</p>
    <h3 style="color:#00E676">EasyPaisa / JazzCash: 0331-6315482</h3>
    <p>After payment, send screenshot to WhatsApp</p>
    <input id="txnId" type="text" placeholder="Enter Transaction ID">
    <button class="btn" onclick="submitPayment()">Submit for Verification</button>
</div>

<!-- 4. LOGIN SCREEN -->
<div id="loginScreen" class="box" style="display:none">
    <h2>Login</h2>
    <input id="loginEmail" type="email" placeholder="Enter Email">
    <input id="loginPass" type="password" placeholder="Enter Password">
    <button class="btn" onclick="submitLogin()">Login</button>
    <p onclick="showMain()" style="margin-top:10px;cursor:pointer">Back</p>
</div>

<!-- 5. DASHBOARD -->
<div id="dashboard" style="display:none">
    <h1>Welcome</h1>
    <div class="box">
        <h3>Your Balance</h3>
        <h2 id="balance" style="color:#00E676;font-size:36px">$0.00</h2>
    </div>
    <button class="logout btn" onclick="logout()" style="background:red">Logout</button>
</div>

<!-- 6. ADMIN PANEL -->
<div id="adminPanel" class="box" style="display:none">
    <h2>Admin Panel - Pending Users</h2>
    <div id="userList"></div>
    <button class="btn" onclick="showMain()">Back</button>
</div>

<!-- 7. ADMIN LOGIN -->
<div id="adminLogin" class="box" style="display:none">
    <h2>Admin Login</h2>
    <input id="adminPass" type="password" placeholder="Enter Admin Password">
    <button class="btn" onclick="checkAdmin()">Login</button>
    <p onclick="showMain()" style="margin-top:10px;cursor:pointer">Back</p>
</div>

<script>
let ADMIN_PASSWORD = "launchx123"; // آپ یہ Password چینج کر دیں
let currentUserEmail = "";

// SCREENS
function showMain(){ hideAll(); document.getElementById('mainScreen').style.display='block'; }
function showSignup(){ hideAll(); document.getElementById('signupScreen').style.display='block'; }
function showPayment(){ hideAll(); document.getElementById('paymentScreen').style.display='block'; }
function showLogin(){ hideAll(); document.getElementById('loginScreen').style.display='block'; }
function showDashboard(){ hideAll(); document.getElementById('dashboard').style.display='block'; updateBalance(); }
function showAdminPanel(){ hideAll(); document.getElementById('adminPanel').style.display='block'; loadUsers(); }
function showAdminLogin(){ hideAll(); document.getElementById('adminLogin').style.display='block'; }
function hideAll(){ 
    document.getElementById('mainScreen').style.display='none';
    document.getElementById('signupScreen').style.display='none';
    document.getElementById('paymentScreen').style.display='none';
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('dashboard').style.display='none';
    document.getElementById('adminPanel').style.display='none';
    document.getElementById('adminLogin').style.display='none';
}

// SIGNUP
function submitSignup(){
    let user = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        pass: document.getElementById('signupPass').value,
        number: document.getElementById('number').value,
        status: "pending", // شروع میں Pending ہوگا
        balance: 0
    }
    if(user.name && user.email && user.pass){
        let users = JSON.parse(localStorage.getItem("allUsers")) || [];
        users.push(user);
        localStorage.setItem("allUsers", JSON.stringify(users));
        currentUserEmail = user.email;
        alert("Account Created! Now pay 300 PKR to activate");
        showPayment();
    } else { alert("Please Fill All Fields") }
}

// PAYMENT SUBMIT
function submitPayment(){
    let txn = document.getElementById('txnId').value;
    if(txn){
        alert("Payment Submitted! Wait for Admin Approval. Contact on WhatsApp: 0331-6315482");
        showMain();
    } else { alert("Enter Transaction ID") }
}

// LOGIN
function submitLogin(){
    let email = document.getElementById('loginEmail').value;
    let pass = document.getElementById('loginPass').value;
    let users = JSON.parse(localStorage.getItem("allUsers")) || [];
    let user = users.find(u => u.email === email && u.pass === pass);
    
    if(user){
        if(user.status === "active"){
            currentUserEmail = email;
            showDashboard();
        } else {
            alert("❌ Your account is not active yet. Please pay 300 PKR and wait for approval");
            showPayment();
        }
    } else { alert("Invalid Email or Password") }
}

// ADMIN
function checkAdmin(){
    if(document.getElementById('adminPass').value === ADMIN_PASSWORD){
        showAdminPanel();
    } else { alert("Wrong Admin Password") }
}

function loadUsers(){
    let users = JSON.parse(localStorage.getItem("allUsers")) || [];
    let list = document.getElementById('userList');
    list.innerHTML = "";
    users.filter(u => u.status === "pending").forEach(user => {
        list.innerHTML += `
        <div class="user-card">
            <p><b>Name:</b> ${user.name}</p>
            <p><b>Email:</b> ${user.email}</p>
            <p><b>Number:</b> ${user.number}</p>
            <button class="activate-btn" onclick="activateUser('${user.email}')">Activate</button>
        </div>`;
    });
}

function activateUser(email){
    let users = JSON.parse(localStorage.getItem("allUsers")) || [];
    users = users.map(u => u.email === email ? {...u, status: "active"} : u);
    localStorage.setItem("allUsers", JSON.stringify(users));
    alert(email + " is now Active!");
    loadUsers();
}

function updateBalance(){
    let users = JSON.parse(localStorage.getItem("allUsers")) || [];
    let user = users.find(u => u.email === currentUserEmail);
    if(user) document.getElementById('balance').innerText = "$" + user.balance.toFixed(2);
}

function logout(){ showMain(); }
</script>

</body>
</html>
