<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAUNCHX</title><style>
body{margin:0;background:green;text-align:center;color:#fff;font-family:Arial}
h1{color:#00ff88;font-size:40px;padding-top:30px}
.box{width:300px;margin:20px auto;padding:15px;background:#0009;border-radius:10px}
input,button{width:90%;padding:10px;margin:6px;border-radius:5px;border:0}
button{background:#00ff88;color:#000;font-weight:bold}
</style></head><body>
<h1>LAUNCH<span style="color:#fff">X</span></h1>
<div class="box" id="a">
<input id="n" placeholder="Name"><input id="e" placeholder="Email">
<input id="p" placeholder="Phone"><input id="w" type="password" placeholder="Password">
<button onclick="s()">Get Started</button></div>
<div class="box" id="b" style="display:none">Wait <span id="t">30</span>s</div>
<div class="box" id="c" style="display:none">
<h3 id="u"></h3>Bal:<b id="bal">0</b>PKR<br>
<button onclick="alert('Task')">Task</button><button onclick="v()">Video</button>
<button onclick="alert('Earn')">Earn</button><button onclick="open('https://wa.me/')">Invite</button></div>
<script>
let x=JSON.parse(localStorage.x||'{}');if(x.n)d();
function s(){x={n:n.value,e:e.value,p:p.value,w:w.value,bal:0};localStorage.x=JSON.stringify(x);a.style.display='none';b.style.display='block';let i=30;let y=setInterval(()=>{t.innerText=i--;if(i<0){clearInterval(y);d()}},1000)}
function d(){b.style.display='none';a.style.display='none';c.style.display='block';u.innerText=x.n;bal.innerText=x.bal}
function v(){open('https://youtube.com');setTimeout(()=>{x.bal+=5;localStorage.x=JSON.stringify(x);d()},30000)}
</script></body></html>
