<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch X Dashboard</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #00C853; color: white; text-align: center; padding: 20px; }
    h1 { margin-bottom: 20px; font-size: 28px; }
    .balance-box {
        background: #004D40;
        padding: 25px;
        border-radius: 15px;
        margin-bottom: 20px;
    }
    .balance-box h3 { font-size: 16px; font-weight: normal; }
    .balance-box h2 { font-size: 36px; color: #00E676; margin-top: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .btn {
        background: #1B1B1B;
        padding: 20px 10px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        border: none;
        color: white;
    }
    .btn span { display: block; font-size: 24px; margin-bottom: 5px; }
    .logout {
        background: red;
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        border: none;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }
    a { text-decoration: none; }
</style>
</head>
<body>

<h1>Welcome Leader</h1>

<div class="balance-box">
    <h3>Your Balance</h3>
    <h2>0 PKR</h2>
</div>

<div class="grid">
    <button class="btn">
        <span>📋</span>
        Complete Task
    </button>

    <!-- YEH WALA BUTTON CHANGE KIYA HAI -->
    <a href="https://video-lemon-chi.vercel.app" target="_blank">
        <button class="btn">
            <span>▶️</span>
            Watch Video
        </button>
    </a>

    <button class="btn">
        <span>💰</span>
        Earn
    </button>

    <button class="btn">
        <span>👥</span>
        Invite Friend
    </button>
</div>

<button class="logout">Logout</button>

</body>
</html>
