<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch X Dashboard</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #00C853; color: white; text-align: center; padding: 20px; }
    h1 { margin-bottom: 20px; font-size: 28px; }
    .balance-box {
        background: #004D40;
        padding: 25px;
        border-radius: 15px;
        margin-bottom: 20px;
    }
    .balance-box h3 { font-size: 16px; font-weight: normal; }
    .balance-box h2 { font-size: 36px; color: #00E676; margin-top: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .btn {
        background: #1B1B1B;
        padding: 20px 10px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        border: none;
        color: white;
    }
    .btn span { display: block; font-size: 24px; margin-bottom: 5px; }
    .logout {
        background: red;
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        border: none;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }
    a { text-decoration: none; }
    input { width:90%;padding:12px;border:none;border-radius:8px;margin-bottom:15px }
    .popup { background:#1B1B1B;padding:30px;border-radius:15px;text-align:center;width:300px }
</style>
</head>
<body>

<!-- LOGIN POPUP -->
<div id="loginBox" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;z-index:9999">
  <div class="popup">
    <h2 style="color:#00E676;margin-bottom:20px">Launch X Login</h2>
    <input id="passwordInput" type="password" placeholder="Password ڈالیں">
    <br>
    <button onclick="checkPassword()" style="background:#00E676;color:#000;border:none;padding:12px 30px;border-radius:8px;font-weight:bold;cursor:pointer;width:90%">
      Login
    </button>
    <p onclick="showForgot()" style="color:#00E676;font-size:12px;margin-top:15px;cursor:pointer;text-decoration:underline">Forgot Password?</p>
    <p id="error" style="color:red;font-size:12px;margin-top:10px"></p>
  </div>
</div>

<!-- FORGOT PASSWORD POPUP -->
<div id="forgotBox" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;justify-content:center;align-items:center;z-index:9999">
  <div class="popup">
    <h2 style="color:#00E676;margin-bottom:20px">Reset Password</h2>
    <input id="emailInput" type="email" placeholder="اپنا Email لکھیں">
    <button onclick="sendOTP()" style="background:#00E676;color:#000;border:none;padding:12px 30px;border-radius:8px;font-weight:bold;cursor:pointer;width:90%">OTP بھیجیں</button>
    <input id="otpInput" type="text" placeholder="OTP یہاں لکھیں" style="margin-top:10px;display:none">
    <input id="newPassInput" type="password" placeholder="نیا Password" style="margin-top:10px;display:none">
    <button id="resetBtn" onclick="resetPassword()" style="background:#00E676;color:#000;border:none;padding:12px 30px;border-radius:8px;font-weight:bold;cursor:pointer;width:90%;display:none;margin-top:10px">Password Change کریں</button>
    <p onclick="backToLogin()" style="color:#aaa;font-size:12px;margin-top:15px;cursor:pointer">واپس Login</p>
    <p id="otpShow" style="color:yellow;font-size:14px;margin-top:10px"></p>
  </div>
</div>

<h1>Welcome Leader</h1>

<div class="balance-box">
    <h3>Your Balance</h3>
    <h2>0 PKR</h2>
</div>

<div class="grid">
    <button class="btn"><span>📋</span>Complete Task</button>
    <a href="https://video-lemon-chi.vercel.app" target="_blank"><button class="btn"><span>▶️</span>Watch Video</button></a>
    <button class="btn"><span>💰</span>Earn</button>
    <button class="btn"><span>👥</span>Invite Friend</button>
    <button class="btn" onclick="copyLink()" style="grid-column: span 2;"><span>🔗</span>Copy Link</button>
</div>

<button class="logout" onclick="logout()">Logout</button>

<script>
// 1. اپنا فکس پاسورڈ اور ای میل یہاں لکھو
let FIX_PASSWORD = "123456"; 
const FIX_EMAIL = "admin@launchx.com"; // یہی ای میل سے OTP ملے گا

let generatedOTP = "";

function checkPassword(){
  const input = document.getElementById('passwordInput').value;
  if(input === FIX_PASSWORD){
    localStorage.setItem("isLoggedIn", "true");
    localStorage.setItem("myPassword", FIX_PASSWORD);
    document.getElementById('loginBox').style.display = 'none';
  } else {
    document.getElementById('error').innerText = "غلط پاسورڈ!";
  }
}

window.onload = function(){
  const savedPass = localStorage.getItem("myPassword");
  if(savedPass) FIX_PASSWORD = savedPass;
  
  if(localStorage.getItem("isLoggedIn") === "true"){
    document.getElementById('loginBox').style.display = 'none';
  }
}

function logout(){
  localStorage.removeItem("isLoggedIn"); 
  location.reload();
}

function copyLink(){
  const websiteLink = window.location.href;
  navigator.clipboard.writeText(websiteLink).then(function() {
    alert("✅ لنک کاپی ہو گیا!");
  });
}

// FORGOT PASSWORD FUNCTIONS
function showForgot(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('forgotBox').style.display = 'flex';
}

function backToLogin(){
  document.getElementById('forgotBox').style.display = 'none';
  document.getElementById('loginBox').style.display = 'flex';
}

function sendOTP(){
  const email = document.getElementById('emailInput').value;
  if(email !== FIX_EMAIL){
    alert("❌ یہ ای میل رجسٹر نہیں ہے");
    return;
  }
  // 6 ہندسوں کا OTP بنا دو
  generatedOTP = Math.floor(100000 + Math.random() * 900000);
  document.getElementById('otpShow').innerText = "آپ کا OTP: " + generatedOTP; // ای میل کی بجائے یہاں شو ہوگا
  document.getElementById('otpInput').style.display = 'block';
  document.getElementById('newPassInput').style.display = 'block';
  document.getElementById('resetBtn').style.display = 'block';
  alert("OTP سکرین پر شو ہو گیا ہے اوپر دیکھیں");
}

function resetPassword(){
  const otp = document.getElementById('otpInput').value;
  const newPass = document.getElementById('newPassInput').value;
  if(otp == generatedOTP){
    FIX_PASSWORD = newPass;
    localStorage.setItem("myPassword", newPass);
    alert("✅ Password Change ہو گیا!");
    backToLogin();
  } else {
    alert("❌ غلط OTP");
  }
}
</script>

</body>
</html>
