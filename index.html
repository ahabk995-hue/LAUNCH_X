<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{text-align:center;font-family:Arial;background:#fff}
.b{background:#f2f2f2;padding:20px;border-radius:10px;width:300px;margin:20px auto;border:2px solid green}
button{background:green;color:#fff;border:0;padding:10px;width:90%;border-radius:6px}
input{width:90%;padding:8px;margin:5px}</style></head><body>

<h2 style="color:green">LAUNCH<span style="color:#000">X</span></h2>

<div class="b" id="s">
<input id="n" placeholder="Name"><br>
<input id="e" placeholder="Email"><br>
<button onclick="go()">Get Started</button>
</div>

<div class="b" id="v" style="display:none">
Verifying... <b id="t">30</b>s
</div>

<div class="b" id="d" style="display:none">
Hi <b id="u"></b><br>Bal: <b id="bal">0</b> PKR<br><br>
<button onclick="alert('Tasks')">Tasks</button>
<button onclick="alert('Earn')">Earn</button>
<button onclick="vdo()">Video +5</button>
<button onclick="open('https://wa.me/')">Members</button>
</div>

<script>
let u=JSON.parse(localStorage.x||'{}');
if(u.n){show()}else{s.style.display='block'}

function go(){
if(!n.value){alert('Name?');return}
u={n:n.value,e:e.value,bal:0};localStorage.x=JSON.stringify(u);
s.style.display='none';v.style.display='block';
let i=30;let z=setInterval(()=>{t.innerText=i--;if(i<0){clearInterval(z);show()}},1000)
}
function show(){v.style.display='none';s.style.display='none';d.style.display='block';u.innerText=u.n;bal.innerText=u.bal}
function vdo(){open('https://youtube.com');setTimeout(()=>{u.bal+=5;localStorage.x=JSON.stringify(u);show();alert('+5')},30000)}
</script></body></html>
