<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAUNCH X</title>
<style>
body{background:#000; color:#fff; text-align:center; font-family:Arial; padding:20px}
.box{background:#111; padding:20px; border-radius:12px; max-width:400px; margin:20px auto}
.btn{background:#00ff88; color:#000; padding:10px; border:none; border-radius:8px; font-weight:bold; width:90%; margin:5px; cursor:pointer}
input{width:90%; padding:10px; margin:5px; background:#222; border:none; color:#fff; border-radius:6px}
.hidden{display:none}
</style>
</head>
<body>

<h1>🚀 LAUNCH X</h1>

<div class="box" id="s">
<h2>Sign Up</h2>
<input id="n" placeholder="Name">
<input id="e" placeholder="Email">
<input id="p" placeholder="Phone">
<button class="btn" onclick="go()">Get Started</button>
</div>

<div class="box hidden" id="v">
<h2>Verifying...</h2>
<p id="t">Wait 30s</p>
</div>

<div class="box hidden" id="d">
<h2>Hi <span id="un"></span></h2>
<p>Balance: <b id="bal">0 PKR</b></p>
<button class="btn" onclick="alert('Daily Tasks')">📋 Daily Tasks</button>
<button class="btn" onclick="alert('Earn 50 PKR per Referral')">💰 Add Earn</button>
<button class="btn" onclick="openVid()">▶️ Watch Video</button>
<button class="btn" onclick="window.open('https://wa.me/','_blank')">👥 Find Members</button>
</div>

<script>
let u=JSON.parse(localStorage.getItem('lx'))||{};
if(u.n){show()}

function go(){
let n=document.getElementById('n').value,e=document.getElementById('e').value,p=document.getElementById('p').value;
if(!n||!e){alert('Fill all');return}
u={n,e,p,bal:0};localStorage.setItem('lx',JSON.stringify(u));
document.getElementById('s').classList.add('hidden');
document.getElementById('v').classList.remove('hidden');
let i=30;x=setInterval(()=>{document.getElementById('t').innerText='Wait '+i+'s';i--;if(i<0){clearInterval(x);show()}},1000)
}

function show(){
document.getElementById('v').classList.add('hidden');
document.getElementById('d').classList.remove('hidden');
document.getElementById('un').innerText=u.n;
document.getElementById('bal').innerText=u.bal+' PKR';
}

function openVid(){
window.open('https://youtube.com','_blank'); // apna link yahan lagao
setTimeout(()=>{u.bal+=5;localStorage.setItem('lx',JSON.stringify(u));alert('+5 PKR Added')},30000)
}
</script>
</body>
</html>
