<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch X Dashboard</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #00C853; color: white; text-align: center; padding: 20px; }
    h1 { margin-bottom: 20px; font-size: 28px; }
    .balance-box {
        background: #004D40;
        padding: 25px;
        border-radius: 15px;
        margin-bottom: 20px;
    }
    .balance-box h3 { font-size: 16px; font-weight: normal; }
    .balance-box h2 { font-size: 36px; color: #00E676; margin-top: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .btn {
        background: #1B1B1B;
        padding: 20px 10px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        border: none;
        color: white;
    }
    .btn span { display: block; font-size: 24px; margin-bottom: 5px; }
    .logout {
        background: red;
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        border: none;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }
    a { text-decoration: none; }
</style>
</head>
<body>

<!-- LOGIN POPUP -->
<div id="loginBox" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;z-index:9999">
  <div style="background:#1B1B1B;padding:30px;border-radius:15px;text-align:center;width:300px">
    <h2 style="color:#00E676;margin-bottom:20px">Launch X Login</h2>
    <input id="passwordInput" type="password" placeholder="Password ڈالیں" 
      style="width:90%;padding:12px;border:none;border-radius:8px;margin-bottom:15px">
    <br>
    <button onclick="checkPassword()" style="background:#00E676;color:#000;border:none;padding:12px 30px;border-radius:8px;font-weight:bold;cursor:pointer">
      Login
    </button>
    <p id="error" style="color:red;font-size:12px;margin-top:10px"></p>
  </div>
</div>

<h1>Welcome Leader</h1>

<div class="balance-box">
    <h3>Your Balance</h3>
    <h2>0 PKR</h2>
</div>

<div class="grid">
    <button class="btn">
        <span>📋</span>
        Complete Task
    </button>

    <a href="https://video-lemon-chi.vercel.app" target="_blank">
        <button class="btn">
            <span>▶️</span>
            Watch Video
        </button>
    </a>

    <button class="btn">
        <span>💰</span>
        Earn
    </button>

    <button class="btn">
        <span>👥</span>
        Invite Friend
    </button>

    <button class="btn" onclick="copyLink()" style="grid-column: span 2;">
        <span>🔗</span>
        Copy Link
    </button>
</div>

<button class="logout" onclick="logout()">Logout</button>

<script>
// 1. اپنا پاسورڈ یہاں لکھو
const FIX_PASSWORD = "123456"; // <-- یہ چینج کر دو

function checkPassword(){
  const input = document.getElementById('passwordInput').value;
  if(input === FIX_PASSWORD){
    localStorage.setItem("isLoggedIn", "true");
    document.getElementById('loginBox').style.display = 'none';
  } else {
    document.getElementById('error').innerText = "غلط پاسورڈ!";
  }
}

window.onload = function(){
  if(localStorage.getItem("isLoggedIn") === "true"){
    document.getElementById('loginBox').style.display = 'none';
  }
}

function logout(){
  localStorage.removeItem("isLoggedIn"); 
  location.reload();
}

function copyLink(){
  const websiteLink = window.location.href;
  navigator.clipboard.writeText(websiteLink).then(function() {
    alert("✅ لنک کاپی ہو گیا! اب دوست کو Send کر دیں");
  });
}
</script>

</body>
</html>
