<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Launch X</title>
<style>body{background:#0b0f14;color:#e5e7eb;font-family:system-ui}.card{background:#111827;border-radius:16px;padding:20px;max-width:900px;margin:20px auto}.btn{padding:14px;border-radius:12px;border:none;background:#22c55e;color:#fff;font-weight:700;cursor:pointer;width:100%}.btn.purple{background:#7c3aed}.field input{width:100%;padding:12px;border-radius:10px;border:1px solid #243244;background:#0b1220;color:#fff}.hidden{display:none}.user-card{background:#0b1220;padding:12px;border-radius:10px;margin:10px 0}</style>
</head>
<body>
<div class="card" id="home">
<h1>Launch X</h1>
<button class="btn" id="toAdmin">🔐 Admin Panel</button>
</div>

<div class="card hidden" id="admin">
<h1>Admin Panel</h1>
<h3>✋ Manual Approve User</h3>
<div class="field"><label>User Email</label><input id="manualEmail" placeholder="user@gmail.com"/></div>
<button class="btn" id="manualApprove">Approve This User - Add 300</button>
<p id="manualSuccess" style="color:#22c55e"></p>
<h3>👥 All Users</h3>
<div id="usersList"></div>
</div>

<script>
const $ = id => document.getElementById(id);
function getUsers(){ return JSON.parse(localStorage.getItem('users')) || []; }
function saveUsers(users){ localStorage.setItem('users', JSON.stringify(users)); }
function loadAdminPanel(){
  let users = getUsers();
  let html = '';
  users.forEach(u => {
    html += `<div class="user-card"><b>${u.name}</b><br>Email: ${u.email}<br>Balance: $${u.balance}<br>Status: ${u.isActive ? 'Active' : 'Pending'}</div>`;
  });
  $('usersList').innerHTML = html || 'No users';
}

$('toAdmin').onclick = () => {
  const email = prompt('Admin Email:');
  const pass = prompt('Admin Password:');
  if(email === 'admin@launchx.com' && pass === 'admin123'){
    loadAdminPanel();
    $('home').classList.add('hidden');
    $('admin').classList.remove('hidden');
  } else { alert('Wrong!'); }
}

$('manualApprove').onclick = () => {
  let email = $('manualEmail').value.trim();
  let users = getUsers();
  let u = users.find(x => x.email === email);
  if(u){
    u.balance = 300; 
    u.isActive = true; 
    saveUsers(users);
    $('manualSuccess').textContent = email + " ko Approve kar diya! 300 added.";
    loadAdminPanel();
  } else {
    alert("Ye email nahi mili!");
  }
}
</script>
</body>
</html>
