<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAUNCH X</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI'}
body{background:#ffffff; color:#000; text-align:center; padding:20px; min-height:100vh}
.logo{font-size:32px; font-weight:bold; color:#00a86b; margin-bottom:10px}
.logo span{color:#000}
.box{background:#f5f5f5; padding:25px; border-radius:15px; max-width:420px; margin:20px auto; border:2px solid #00a86b; box-shadow:0 4px 15px rgba(0,0,0,0.1)}
.btn{background:#00a86b; color:#fff; padding:12px; border:none; border-radius:10px; font-weight:bold; width:90%; margin:8px; cursor:pointer; font-size:16px}
.btn:hover{background:#008f5a}
input{width:90%; padding:12px; margin:8px; background:#fff; border:1px solid #ccc; color:#000; border-radius:8px}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:15px}
.card{background:#fff; padding:15px; border-radius:12px; border:2px solid #00a86b; cursor:pointer}
.card h3{color:#00a86b; font-size:14px}
.loader{border:4px solid #ddd; border-top:4px solid #00a86b; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; margin:15px auto}
@keyframes spin {100%{transform:rotate(360deg)}}
.balance{font-size:24px; color:#00a86b; font-weight:bold}
</style>
</head>
<body>

<div class="logo">LAUNCH<span>X</span></div>

<!-- 1. FRONT PAGE -->
<div class="box" id="s">
<h2>Welcome to LAUNCH X</h2>
<p style="color:#555; font-size:14px">Earn Money By Completing Simple Tasks</p>
<input id="n" placeholder="Enter Name">
<input id="e" placeholder="Enter Email">
<input id="p" placeholder="WhatsApp Number">
<button class="btn" onclick="go()">Get Started</button>
</div>

<!-- 2. VERIFICATION 30s -->
<div class="box" id="v" style="display:none">
<h2>Verifying Account</h2>
<div class="loader"></div>
<p id="t">Please wait 30 seconds</p>
</div>

<!-- 3. DASHBOARD -->
<div class="box" id="d" style="display:none">
<h2>Welcome, <span id="un"></span>!</h2>
<p>Your Balance</p>
<p class="balance" id="bal">0.00 PKR</p>

<div class="grid">
  <div class="card" onclick="alert('Daily Tasks Open')">
    <h3>📋 DAILY TASKS</h3>
    <p>Review & Earn</p>
  </div>
  <div class="card" onclick="alert('Earn 50 PKR per Referral')">
    <h3>💰 ADD EARN</h3>
    <p>Invite Friends</p>
  </div>
  <div class="card" onclick="openVid()">
    <h3>▶️ WATCH VIDEO</h3>
    <p>Earn 5 PKR</p>
  </div>
  <div class="card" onclick="window.open('https://wa.me/','_blank')">
    <h3>👥 FIND MEMBERS</h3>
    <p>Join Group</p>
  </div>
</div>
</div>

<script>

  if(u){
    u = JSON.parse(u);
    if(u.n){ showDashboard(u) } 
    else { showSignup() }
  } else { showSignup() }
}
