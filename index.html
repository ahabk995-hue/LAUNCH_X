<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch X</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #00C853; color: white; text-align: center; padding: 20px; }
    h1 { margin-bottom: 20px; font-size: 28px; }
    .box {
        background: #1B1B1B;
        padding: 25px;
        border-radius: 15px;
        max-width: 400px;
        margin: 20px auto;
    }
    .btn {
        background: #00E676;
        color: #000;
        border: none;
        padding: 15px;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
        font-size: 16px;
    }
    .btn2 {
        background: #1B1B1B;
        color: white;
        border: 2px solid #00E676;
        padding: 20px 10px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        width: 48%;
    }
    input {
        width:100%;
        padding:12px;
        border:none;
        border-radius:8px;
        margin-bottom:15px;
        background:#333;
        color:white;
    }
    .pass-box { position: relative; }
    .eye {
        position: absolute;
        right: 15px;
        top: 12px;
        cursor: pointer;
        font-size: 18px;
    }
    .grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; }
    .logout {
        background: red;
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        border: none;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 20px;
    }
    a { text-decoration: none; color: #00E676; }
</style>
</head>
<body>

<!-- 1. MAIN SCREEN: 3 OPTIONS -->
<div id="mainScreen" class="box">
    <h1>Launch X</h1>
    <a href="https://wa.me/923316315482" target="_blank"><button class="btn">📞 WhatsApp Support: 0331-6315482</button></a>
    <button class="btn" onclick="showSignup()">Creating Account</button>
    <button class="btn" onclick="showLogin()">Login - Already Existing Account</button>
</div>

<!-- 2. SIGNUP SCREEN -->
<div id="signupScreen" class="box" style="display:none">
    <h2>Creating Account</h2>
    <input id="name" type="text" placeholder="Name">
    <input id="email" type="email" placeholder="Email">
    <div class="pass-box">
        <input id="signupPass" type="password" placeholder="Set Password">
        <span class="eye" onclick="togglePass('signupPass')">👁️</span>
    </div>
    <input id="number" type="number" placeholder="Phone Number">
    <button class="btn" onclick="submitSignup()">Submit</button>
    <p onclick="showMain()" style="margin-top:10px;cursor:pointer">واپس</p>
</div>

<!-- 3. LOGIN SCREEN -->
<div id="loginScreen" class="box" style="display:none">
    <h2>Login</h2>
    <input id="loginEmail" type="email" placeholder="Email">
    <div class="pass-box">
        <input id="loginPass" type="password" placeholder="Password">
        <span class="eye" onclick="togglePass('loginPass')">👁️</span>
    </div>
    <button class="btn" onclick="submitLogin()">Login</button>
    <p onclick="showMain()" style="margin-top:10px;cursor:pointer">واپس</p>
</div>

<!-- 4. DASHBOARD SCREEN -->
<div id="dashboard" style="display:none">
    <h1>Welcome Leader</h1>
    <div class="box">
        <h3>Your Balance</h3>
        <h2 style="color:#00E676;font-size:36px">0 PKR</h2>
    </div>

    <div class="grid">
        <!-- 1. WATCH VIDEO - آپ کا دیا ہوا لنک -->
        <a href="https://video-lemon-chi.vercel.app" target="_blank" style="width:48%">
            <button class="btn2"><span style="font-size:24px">▶️</span><br>Watch Video</button>
        </a>
        
        <button class="btn2" onclick="alert('Task Complete!')"><span style="font-size:24px">📋</span><br>Complete Task</button>
        
        <!-- 2. INVITE FRIEND - آپ کا دیا ہوا لنک -->
        <a href="https://launch-x-f7n5.vercel.app" target="_blank" style="width:48%">
            <button class="btn2"><span style="font-size:24px">👥</span><br>Invite Friends</button>
        </a>
        
        <button class="btn2"><span style="font-size:24px">💰</span><br>Earn</button>
    </div>

    <button class="logout" onclick="logout()">Logout</button>

    <!-- COPY LINK -->
    <div class="box" style="margin-top:20px">
        <p>Website Link Copy کریں</p>
        <button class="btn" onclick="copyLink()">🔗 Copy Website Link</button>
    </div>
</div>

<script>
// SCREEN SWITCH
function showMain(){
    document.getElementById('mainScreen').style.display='block';
    document.getElementById('signupScreen').style.display='none';
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('dashboard').style.display='none';
}
function showSignup(){
    document.getElementById('mainScreen').style.display='none';
    document.getElementById('signupScreen').style.display='block';
}
function showLogin(){
    document.getElementById('mainScreen').style.display='none';
    document.getElementById('loginScreen').style.display='block';
}
function showDashboard(){
    document.getElementById('mainScreen').style.display='none';
    document.getElementById('signupScreen').style.display='none';
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('dashboard').style.display='block';
}

// PASSWORD EYE
function togglePass(id){
    let x = document.getElementById(id);
    x.type = x.type === "password" ? "text" : "password";
}

// SIGNUP + LOGIN - LOCAL STORAGE
function submitSignup(){
    let user = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        pass: document.getElementById('signupPass').value,
        number: document.getElementById('number').value
    }
    if(user.name && user.email && user.pass){
        localStorage.setItem("user", JSON.stringify(user));
        alert("✅ Account بن گیا!");
        showDashboard();
    } else { alert("❌ سب فیلڈ بھریں") }
}

function submitLogin(){
    let user = JSON.parse(localStorage.getItem("user"));
    let email = document.getElementById('loginEmail').value;
    let pass = document.getElementById('loginPass').value;
    if(user && user.email === email && user.pass === pass){
        showDashboard();
    } else { alert("❌ غلط Email یا Password") }
}

function logout(){
    showMain();
}

// COPY FUNCTIONS
function copyLink(){
    navigator.clipboard.writeText(window.location.href);
    alert("✅ Website Link Copy ہو گیا!");
}
</script>

</body>
</html>
