<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Launch X</title>
  <style>
    :root{--bg:#0b0f14;--card:#111827;--muted:#94a3b8;--text:#e5e7eb;--brand:#3b82f6;--brand2:#22c55e;--warn:#f59e0b}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui;background:linear-gradient(180deg,#0b0f14,#0a0a0a);color:var(--text)}
    .container{max-width:900px;margin:0 auto;padding:24px}
    .card{background:var(--card);border:1px solid #1f2937;border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
    h1{font-size:28px;margin:0 0 8px} p{color:var(--muted);margin:0 0 16px}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;border:1px solid #243244;background:#0f172a;color:#fff;text-decoration:none;font-weight:600;cursor:pointer;width:100%;justify-content:center}
    .btn:hover{transform:translateY(-1px);background:#1e293b}
    .btn.brand{background:var(--brand);border-color:#1d4ed8}
    .btn.green{background:var(--brand2);border-color:#15803d}
    .btn.yellow{background:var(--warn);border-color:#b45309;color:#111}
    .grid{display:grid;gap:16px}
    @media(min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
    input,button{font:inherit}
    .field{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
    .field input{padding:12px 14px;border-radius:10px;border:1px solid #243244;background:#0b1220;color:#fff}
    .hidden{display:none}
    .timer{font-size:22px;font-weight:800;letter-spacing:.5px}
    .dashboard{display:grid;gap:12px}
    .video-frame{width:100%;aspect-ratio:9/16;border:0;border-radius:12px;background:#000}
    .checkbox{display:flex;align-items:center;gap:10px;margin:8px 0}
    .note{font-size:12px;color:#94a3b8;text-align:center;margin-top:16px}
    .link-btn{background:none;border:none;color:#3b82f6;text-decoration:underline;cursor:pointer;font-size:14px;padding:0}
  </style>
</head>
<body>
  <div class="container">
    <!-- HOME -->
    <section id="home" class="card">
      <h1>Welcome to <span style="color:#3b82f6">Launch X</span></h1>
      <p>Earn money by completing simple tasks. Start now!</p>
      <button class="btn green" id="toRegister">Click to Login / Register</button>
      <div class="note">Already have an account? <button class="link-btn" id="toLogin">Login Here</button></div>
    </section>

    <!-- REGISTER -->
    <section id="register" class="card hidden">
      <h1>Create Your Account</h1>
      <form id="regForm" class="grid">
        <div class="field"><label>Name</label><input name="name" required/></div>
        <div class="field"><label>Email</label><input name="email" type="email" required/></div>
        <div class="field"><label>Phone</label><input name="phone" required/></div>
        <div class="field"><label>Password</label><input name="password" type="password" required/></div>
        <button class="btn green" type="submit">Submit & Verify</button>
      </form>
      <button class="btn" id="backHome1" style="margin-top:12px">← Back</button>
    </section>

    <!-- LOGIN -->
    <section id="login" class="card hidden">
      <h1>Login</h1>
      <form id="loginForm" class="grid">
        <div class="field"><label>Email</label><input name="email" type="email" required/></div>
        <div class="field"><label>Password</label><input name="password" type="password" required/></div>
        <button class="btn brand" type="submit">Login Now</button>
      </form>
      <button class="btn" id="backHome2" style="margin-top:12px">← Back</button>
    </section>

    <!-- VERIFY -->
    <section id="verify" class="card hidden">
      <h1>Verifying...</h1>
      <p>Please wait <span class="timer" id="timer">30</span> seconds</p>
    </section>

    <!-- DASHBOARD -->
    <section id="dashboard" class="card hidden">
      <h1>Dashboard</h1>
      <div class="dashboard">
        <button class="btn yellow" id="addEarn">ADD EARN</button>
        <button class="btn brand" id="watchVideo">WATCH VIDEO</button>
        <a class="btn green" id="invite" href="https://renvex.co/signup?ref=47413" target="_blank">INVITE MEMBERS</a>
        <button class="btn" id="task">TASK</button>
      </div>
    </section>

    <!-- VIDEO -->
    <section id="video" class="card hidden">
      <h1>Watch Video to Earn</h1>
      <div class="checkbox"><input type="checkbox" id="c1"/><label for="c1">I will watch the full video</label></div>
      <div class="checkbox"><input type="checkbox" id="c2"/><label for="c2">I will not skip</label></div>
      <div class="checkbox"><input type="checkbox" id="c3"/><label for="c3">I agree to the terms</label></div>
      <button class="btn green" id="openVideo" disabled>Open Video</button>
      <button class="btn" id="backDash" style="margin-top:12px">← Back to Dashboard</button>
      <div id="videoBox" class="hidden" style="margin-top:16px">
        <iframe class="video-frame" src="https://www.youtube.com/embed/YOUR_VIDEO_ID" allowfullscreen></iframe>
      </div>
    </section>
  </div>

<script>
  const $ = id => document.getElementById(id);
  function show(id){
    ['home','register','login','verify','dashboard','video'].forEach(s => $(s).classList.add('hidden'));
    $(id).classList.remove('hidden');
  }

  // Navigation - FIXED
  document.addEventListener('DOMContentLoaded', function() {
    $('toRegister').onclick = () => show('register');
    $('toLogin').onclick = () => show('login'); 
    $('backHome1').onclick = () => show('home');
    $('backHome2').onclick = () => show('home');
    $('backDash').onclick = () => show('dashboard');

    // Register
    $('regForm').onsubmit = e => {
      e.preventDefault();
      show('verify');
      let t=30; $('timer').textContent=t;
      const iv=setInterval(()=>{t--; $('timer').textContent=t; if(t<=0){clearInterval(iv); show('dashboard')}},1000);
    }

    // Login - DIRECT DASHBOARD
    $('loginForm').onsubmit = e => {
      e.preventDefault();
      show('dashboard'); 
    }

    // Dashboard Buttons
    $('addEarn').onclick = () => alert('ADD EARN: Coming Soon!');
    $('watchVideo').onclick = () => show('video');
    $('task').onclick = () => alert('TASK: New tasks coming soon!');
    // INVITE button is now a link, no JS needed

    // Video
    ['c1','c2','c3'].forEach(id=>$(id).onchange=()=>{
      $('openVideo').disabled = !($('c1').checked && $('c2').checked && $('c3').checked)
    });
    $('openVideo').onclick = () => {
      $('videoBox').classList.remove('hidden');
      $('openVideo').textContent = 'Video Opened ✓'
    }
  });
</script>
</body>
</html>
